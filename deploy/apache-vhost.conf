# Atelier PDF - Apache virtual host
#
# A single FastAPI app on localhost:10560 serves both the API (/api/*) and the
# static frontend, so one ProxyPass is enough.
#
# This file starts as HTTP-only so certbot can answer the HTTP-01 challenge.
# `certbot --apache -d your.host` then appends the :443 vhost and the redirect.

<VirtualHost *:80>
    ServerName pdf.chalco.website

    DocumentRoot /var/www/html

    ProxyPreserveHost On
    # Analysing a PDF of several hundred pages can take ten seconds or so, and
    # so can rendering and pixel verification.
    ProxyTimeout 300

    # ACME challenges must land on disk, not in the proxy.
    ProxyPassMatch   ^/\.well-known/  !

    ProxyPass        /  http://127.0.0.1:10560/
    ProxyPassReverse /  http://127.0.0.1:10560/

    # A 40 MB PDF must get through.
    LimitRequestBody 52428800

    ErrorLog  /var/log/httpd/pdf.chalco.website_error.log
    CustomLog /var/log/httpd/pdf.chalco.website_access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =pdf.chalco.website
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
